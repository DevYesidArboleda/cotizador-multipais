version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      angular: { patterns: ["@angular*", "@angular-devkit/*"] }
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups:
      strapi: { patterns: ["@strapi/*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
