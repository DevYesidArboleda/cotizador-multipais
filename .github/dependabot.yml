# Política de dependencias (ADR-003):
# - Un PR agrupado por ecosistema para no inundar el repo de PRs.
# - Node solo en versiones LTS soportadas por Strapi 5: los saltos de major de Node/Angular/Strapi
#   se hacen a mano con un ADR, nunca automáticamente.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    commit-message: { prefix: "ci(deps)" }
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/frontend", "/backend"]
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    commit-message: { prefix: "build(deps)" }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]

  # npm se habilita por módulo SOLO cuando existe su package.json (si no, Dependabot falla con "package.json not found").
  # /backend: habilitado abajo. /frontend: PENDIENTE hasta que exista frontend/package.json; al añadirlo, agrupar y
  # ignorar majors de Angular (ignore: dependency-name "@angular/*", update-types version-update:semver-major).
  # Responsable: @devops-engineer.

  # npm backend: habilitado (existe backend/package.json). Un solo PR agrupado; sin majors de Strapi.
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    commit-message: { prefix: "build(deps)" }
    ignore:
      - dependency-name: "@strapi/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: strapi
        update-types: ["version-update:semver-major"]
    groups:
      backend-npm:
        patterns: ["*"]
