# CI — puertas de calidad que bloquean el merge (ADR-003, skill docker-single-command-ops §4)
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detectar módulos
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.d.outputs.frontend }}
      backend: ${{ steps.d.outputs.backend }}
      e2e: ${{ steps.d.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        # Mientras el flujo SDD avanza, frontend/ y backend/ aún pueden no existir: sus jobs se omiten sin fallar.
        run: |
          has() { [ -e "$1" ] && echo true || echo false; }
          {
            echo "frontend=$(has frontend/package.json)"
            echo "backend=$(has backend/package.json)"
            if [ -d frontend/e2e ] && [ -f frontend/package.json ] && [ -f backend/package.json ]; then echo "e2e=true"; else echo "e2e=false"; fi
          } >> "$GITHUB_OUTPUT"

  governance:
    name: Gobierno (trazabilidad + secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint de workflows (actionlint, imagen oficial con shellcheck)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color
      - name: Trazabilidad US → SPEC → ADR → tests → review
        run: node scripts/trace-check.mjs
      - name: Contrato Strapi compila con tsc --strict, sin any (ADR-001 §6)
        # TypeScript se descarga solo para este paso (sin instalación global ni package.json en la raíz).
        run: npx -y -p typescript@5 tsc --noEmit --strict --target ES2022 --module ES2022 --moduleResolution bundler docs/contracts/strapi-contracts.ts
      - name: Autoprueba del smoke de seguridad (servidor simulado, detecta fallos)
        run: node scripts/security-smoke.selftest.mjs
      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ningún token de Strapi en el frontend
        run: |
          if [ -d frontend/src ] && grep -rniE "bearer |api[_-]?token|STRAPI_[A-Z_]*(TOKEN|SECRET)|localhost:1337|Authorization" frontend/src --include=*.ts --include=*.html --exclude='*.spec.ts' --exclude-dir=testing; then
            echo "::error::Se encontró un posible token o URL directa de Strapi en frontend/src"; exit 1
          fi

  frontend:
    name: Frontend (lint, unit, build)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build -- --configuration production
      - name: Bundle sin secretos
        run: |
          if grep -rniE "bearer |api[_-]?token|STRAPI_[A-Z_]*(TOKEN|SECRET)|localhost:1337|Authorization" dist/; then
            echo "::error::El bundle contiene un posible secreto o URL directa de Strapi"; exit 1
          fi

  backend:
    name: Backend (build Strapi)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: npm audit (informativo)
        run: npm audit --omit=dev --audit-level=critical || true

  e2e:
    name: E2E (docker compose + smoke + Playwright)
    runs-on: ubuntu-latest
    needs: [detect, frontend, backend]
    if: needs.detect.outputs.e2e == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Levantar el stack con un solo comando (SQLite)
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Extraer el bundle servido por la imagen (para el punto 9 del smoke)
        run: docker compose cp frontend:/usr/share/nginx/html ./served-bundle
      - name: Smoke de seguridad (ADR-002 §6) contra proxy y Strapi directo
        env:
          APP_URL: http://localhost:4200
          STRAPI_URL: http://localhost:1337
          SMOKE_BUNDLE_DIR: served-bundle
        run: node scripts/security-smoke.mjs
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --fail-on-flaky-tests
        env:
          E2E_BASE_URL: http://localhost:4200
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
      - name: Logs del stack si falla
        if: failure()
        run: |
          docker compose logs --no-color > compose.log
          tail -200 compose.log
      - name: Apagar el stack
        if: ${{ always() }}
        run: docker compose down -v

  e2e-postgres:
    name: E2E Postgres (paridad con la nube, ADR-002 R1)
    runs-on: ubuntu-latest
    needs: [detect, frontend, backend]
    if: needs.detect.outputs.e2e == 'true'
    timeout-minutes: 30
    env:
      # Override con servicio postgres; mismas imágenes, solo cambian variables (12-factor).
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgres.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Levantar el stack con Postgres
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Verificar que Strapi usa Postgres
        run: docker compose exec -T postgres psql -U strapi -d strapi -tAc "select count(*) from information_schema.tables where table_name = 'strapi_core_store_settings'" | grep -qx 1
      - name: Extraer el bundle servido por la imagen
        run: docker compose cp frontend:/usr/share/nginx/html ./served-bundle
      - name: Smoke de seguridad (ADR-002 §6) contra proxy y Strapi directo
        env:
          APP_URL: http://localhost:4200
          STRAPI_URL: http://localhost:1337
          SMOKE_BUNDLE_DIR: served-bundle
        run: node scripts/security-smoke.mjs
      - name: E2E-S de solo lectura contra Strapi sobre Postgres (sin token de escritura)
        # Solo los tests marcados @strapi (leen el seed; convención de playwright.config.ts). Los E2E-M usan page.route
        # y no dependen de la BD, por eso ya los cubre el job e2e. Si no hubiese ningún @strapi, Playwright falla (intencional).
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --grep @strapi --fail-on-flaky-tests
        env:
          E2E_BASE_URL: http://localhost:4200
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-postgres
          path: frontend/playwright-report
          retention-days: 14
      - name: Logs del stack si falla
        if: failure()
        run: |
          docker compose logs --no-color > compose.log
          tail -200 compose.log
      - name: Apagar el stack
        if: ${{ always() }}
        run: docker compose down -v

  images:
    name: Imágenes (build + escaneo Trivy)
    runs-on: ubuntu-latest
    needs: [detect, frontend, backend]
    if: needs.detect.outputs.frontend == 'true' && needs.detect.outputs.backend == 'true'
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: cotizador-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy (HIGH/CRITICAL, informativo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (fijado por SHA)
        with:
          image-ref: cotizador-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
