# CD — publica imágenes inmutables en GHCR y despliega en Render (ADR-003, skill free-tier-deploy)
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publicar imágenes en GHCR
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Desplegar en Render
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy backend (Strapi) con imagen inmutable
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_BACKEND no configurado; se omite"; exit 0; fi
          IMG=$(echo "ghcr.io/${{ github.repository }}-backend:${{ needs.publish.outputs.sha }}" | tr '[:upper:]' '[:lower:]')
          curl -fsS -X POST "${HOOK}&imgURL=$(jq -rn --arg v "$IMG" '$v|@uri')"
      - name: Deploy frontend (Nginx) con imagen inmutable
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_FRONTEND no configurado; se omite"; exit 0; fi
          IMG=$(echo "ghcr.io/${{ github.repository }}-frontend:${{ needs.publish.outputs.sha }}" | tr '[:upper:]' '[:lower:]')
          curl -fsS -X POST "${HOOK}&imgURL=$(jq -rn --arg v "$IMG" '$v|@uri')"
      - name: Smoke test post-deploy (HITL-4 lo confirma)
        env:
          APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::warning::vars.PUBLIC_APP_URL no configurada; se omite smoke"; exit 0; fi
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/countries?filters%5Bcode%5D%5B%24eq%5D=co" | grep -q '"code":"co"'; then ok=1; break; fi
            echo "Esperando arranque (free tier en frío)... intento $i"; sleep 20
          done
          [ "${ok:-0}" = 1 ] || { echo "::error::Smoke falló"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$APP_URL/api/form-fields")
          [ "$code" -ge 400 ] || { echo "::error::Escritura anónima permitida ($code)"; exit 1; }
