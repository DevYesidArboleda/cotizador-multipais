# CD — publica imágenes inmutables en GHCR y despliega en Render (ADR-003, skill free-tier-deploy)
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    name: ¿Hay aplicación que publicar?
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.d.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: d
        # Hasta que existan frontend/ y backend/ (Fases 4-5 del flujo SDD) no hay imágenes que publicar.
        run: |
          if [ -f frontend/package.json ] && [ -f backend/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aún no existen frontend/ y backend/: se omite la publicación y el despliegue."
          fi

  publish:
    name: Publicar imágenes en GHCR
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        env:
          REPO: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "sha=$(git rev-parse --short HEAD)"
            echo "image=${REGISTRY}/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')-${SERVICE}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Desplegar en Render
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy backend (Strapi) con imagen inmutable
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_BACKEND no configurado; se omite"; exit 0; fi
          IMG=$(echo "ghcr.io/${REPO}-backend:${SHA}" | tr '[:upper:]' '[:lower:]')
          curl -fsS -X POST "${HOOK}&imgURL=$(jq -rn --arg v "$IMG" '$v|@uri')"
      - name: Deploy frontend (Nginx) con imagen inmutable
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_FRONTEND no configurado; se omite"; exit 0; fi
          IMG=$(echo "ghcr.io/${REPO}-frontend:${SHA}" | tr '[:upper:]' '[:lower:]')
          curl -fsS -X POST "${HOOK}&imgURL=$(jq -rn --arg v "$IMG" '$v|@uri')"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Despertar el frontend y comprobar GET / (free tier en frío, hasta ~10 min)
        env:
          APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::warning::vars.PUBLIC_APP_URL no configurada; se omite el smoke post-deploy"; exit 0; fi
          curl -fsS --retry 40 --retry-delay 15 --retry-all-errors --max-time 30 -o /dev/null "${APP_URL%/}/"
      - name: Smoke de seguridad post-deploy (ADR-002 §6; HITL-4 lo confirma)
        env:
          APP_URL: ${{ vars.PUBLIC_APP_URL }}
          STRAPI_URL: ${{ vars.PUBLIC_STRAPI_URL }}
          SMOKE_WAIT_SECONDS: "600"
        run: |
          if [ -z "$APP_URL" ]; then echo "::warning::vars.PUBLIC_APP_URL no configurada; se omite el smoke post-deploy"; exit 0; fi
          if [ -z "$STRAPI_URL" ]; then echo "::warning::vars.PUBLIC_STRAPI_URL no configurada; se omiten los puntos que requieren la URL directa de Strapi (3, 6, 8)"; fi
          node scripts/security-smoke.mjs
