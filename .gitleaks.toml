# gitleaks: reglas por defecto + allowlist MINIMA (ADR-002 R6, ADR-003 §4.1).
# Unica excepcion: los valores FICTICIOS de desarrollo local de los compose (no se usan en la nube;
# alli vienen de Render/GitHub Secrets). No hay allowlist por regex (seria valida en todo el repo)
# ni para .env.example (solo contiene marcadores de posicion).
title = "cotizador-multipais"

[extend]
useDefault = true

[allowlist]
description = "docker-compose*.yml: valores ficticios de desarrollo"
paths = [
  '''^docker-compose(\.postgres)?\.yml$''',
]
